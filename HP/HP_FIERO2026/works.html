<head>

  <title>Works — 準備中 | FIERO</title>
  <meta name="description" content="FIEROが手がけたビスポークスーツ・パティーヌシューズの仕上がり事例。現在準備中です。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-accent: #1A2942;
      --color-divider: #C9A961;
      --color-text-primary: #2A2620;
      --color-text-muted: #9C9388;
      --color-bg-alt: #FAF8F3;
    }
    body {
      font-family: 'Noto Serif JP', serif;
      background-color: #fff;
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    .header {
      padding: 20px 32px;
      border-bottom: 1px solid #E5DCC8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      color: var(--color-accent);
      text-decoration: none;
    }
    .header-back {
      font-family: 'Inter', sans-serif;
      font-size: 0.8125rem;
      letter-spacing: 0.12em;
      color: var(--color-text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .header-back:hover { color: var(--color-accent); }

    /* メインコンテンツ */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      text-align: center;
    }
    .coming-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.8125rem;
      letter-spacing: 0.35em;
      color: var(--color-divider);
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .coming-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      color: var(--color-accent);
      margin-bottom: 24px;
      line-height: 1.3;
    }
    .coming-divider {
      width: 40px;
      height: 1px;
      background: var(--color-divider);
      margin: 0 auto 28px;
    }
    .coming-text {
      font-family: 'Noto Serif JP', serif;
      font-size: 1rem;
      font-weight: 300;
      line-height: 2.0;
      color: var(--color-text-muted);
      max-width: 360px;
      margin: 0 auto 48px;
    }
    .coming-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 36px;
      background-color: #06C755;
      color: #fff;
      font-family: 'Noto Serif JP', serif;
      font-size: 0.9375rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .coming-btn:hover { opacity: 0.85; }

    /* フッター */
    .footer {
      padding: 24px 32px;
      border-top: 1px solid #E5DCC8;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="header-logo">FIERO</a>
    <a href="index.html" class="header-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 12H4M10 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      トップに戻る
    </a>
  </header>

  <main class="main">
    <p class="coming-eyebrow">Coming Soon</p>
    <h1 class="coming-title">Works</h1>
    <div class="coming-divider"></div>
    <p class="coming-text">
      FIEROが手がけた一着の記録を<br>
      準備しています。<br>
      しばらくお待ちください。
    </p>
    <a href="https://line.me/R/ti/p/@538mhqlu" target="_blank" rel="noopener" class="coming-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.03 2 11c0 3.52 2.1 6.59 5.25 8.38-.18.67-.67 2.43-.77 2.81-.12.46.17.46.36.33.15-.1 2.36-1.56 3.32-2.19.54.08 1.09.12 1.64.12 5.52 0 10-4.03 10-9 0-4.97-4.48-9-10-9z"/></svg>
      LINEでご相談はこちら
    </a>
  </main>

  <footer class="footer">
    © 2026 FIERO. All rights reserved.
  </footer>

</body>
</html>
